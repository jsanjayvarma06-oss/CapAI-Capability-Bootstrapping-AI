[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capai"
version = "0.1.0"
description = "CapAI -- a self-expanding capability-acquisition layer for AI systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["capai*"]
