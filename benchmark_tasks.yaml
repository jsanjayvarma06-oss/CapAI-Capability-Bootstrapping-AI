meta:
  version: "2.0"
  total_tasks: 170
  workflows: [run, build]
  difficulties: [Easy, Medium, Hard]
  categories:
    - String and Text Processing
    - Numerical and Mathematical
    - Data Structures and Algorithms
    - File and IO Utilities
    - Date Time and Calendar
    - Validation and Parsing
    - Encoding and Hashing
    - India Specific Utilities
    - Object Oriented Classes
    - Multi Component Pipelines
    - Adversarial and Edge Case

tasks:

  # ──────────────────────────────────────────────
  # CATEGORY 1: String and Text Processing (25)
  # ──────────────────────────────────────────────

  - id: reverse_words
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return the sentence with word order reversed, preserving spacing between words."
    args: ["hello world foo bar"]
    expected: "bar foo world hello"
    check: exact

  - id: count_vowels
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return the count of vowel characters (a, e, i, o, u) in string s, case-insensitive."
    args: ["Hello World"]
    expected: 3
    check: exact

  - id: title_case
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return string s converted to title case where the first letter of each word is capitalised."
    args: ["the quick brown fox"]
    expected: "The Quick Brown Fox"
    check: exact

  - id: is_pangram
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return True if string s contains every letter of the English alphabet at least once, ignoring case."
    args: ["The quick brown fox jumps over the lazy dog"]
    expected: true
    check: exact

  - id: longest_common_prefix
    category: String and Text Processing
    difficulty: Medium
    workflow: run
    description: "Return the longest string that is a prefix of every string in the list strs. Return empty string if none exists."
    args: [["flower", "flow", "flight"]]
    expected: "fl"
    check: exact

  - id: run_length_encode
    category: String and Text Processing
    difficulty: Medium
    workflow: run
    description: "Return run-length encoding of string s. For example aaabbc becomes 3a2b1c."
    args: ["aaabbc"]
    expected: "3a2b1c"
    check: exact

  - id: caesar_cipher
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Apply Caesar cipher to string s with the given integer shift. Wrap around alphabet boundaries. Preserve case and non-alpha characters."
    args: ["Hello, World!", 3]
    expected: "Khoor, Zruog!"
    check: exact

  - id: remove_duplicate_chars
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return string s with duplicate characters removed, keeping only the first occurrence of each character."
    args: ["programming"]
    expected: "progamin"
    check: exact

  - id: word_frequency
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return a dict mapping each word in string text to its frequency count. Words are lowercased and split by whitespace."
    args: ["the cat sat on the mat the cat"]
    expected: {"the": 3, "cat": 2, "sat": 1, "on": 1, "mat": 1}
    check: exact

  - id: levenshtein_distance
    category: String and Text Processing
    difficulty: Hard
    workflow: run
    description: "Return the Levenshtein edit distance between strings a and b."
    args: ["kitten", "sitting"]
    expected: 3
    check: exact

  - id: is_anagram
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return True if string a is an anagram of string b, ignoring case and whitespace."
    args: ["Listen", "Silent"]
    expected: true
    check: exact

  - id: truncate_string
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return string s truncated to max_length characters. If truncated, append ellipsis so total length equals max_length."
    args: ["Hello World this is a long string", 10]
    expected: "Hello W..."
    check: exact

  - id: count_words
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return the number of words in string s, where words are separated by whitespace."
    args: ["  hello   world  foo  "]
    expected: 3
    check: exact

  - id: snake_to_camel
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Convert snake_case string s to camelCase."
    args: ["hello_world_foo_bar"]
    expected: "helloWorldFooBar"
    check: exact

  - id: camel_to_snake
    category: String and Text Processing
    difficulty: Medium
    workflow: run
    description: "Convert camelCase string s to snake_case."
    args: ["helloWorldFooBar"]
    expected: "hello_world_foo_bar"
    check: exact

  - id: count_substring
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return the number of non-overlapping occurrences of substring sub in string s."
    args: ["ababab", "ab"]
    expected: 3
    check: exact

  - id: reverse_string
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return string s reversed."
    args: ["Hello World"]
    expected: "dlroW olleH"
    check: exact

  - id: capitalize_first
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return string s with only the very first character capitalised and the rest unchanged."
    args: ["hello world"]
    expected: "Hello world"
    check: exact

  - id: remove_whitespace
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return string s with all whitespace characters removed."
    args: ["  hello   world  "]
    expected: "helloworld"
    check: exact

  - id: is_palindrome_str
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return True if string s is a palindrome ignoring case, spaces, and punctuation."
    args: ["A man a plan a canal Panama"]
    expected: true
    check: exact

  - id: longest_word
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return the longest word in string sentence. If tie, return the first one."
    args: ["The quick brown fox jumps"]
    expected: "jumps"
    check: exact

  - id: char_frequency
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return a dict mapping each unique character in string s to its frequency."
    args: ["aabbcc"]
    expected: {"a": 2, "b": 2, "c": 2}
    check: exact

  - id: strip_html_tags
    category: String and Text Processing
    difficulty: Medium
    workflow: run
    description: "Return string html with all HTML tags removed, leaving only the text content."
    args: ["<p>Hello <b>World</b></p>"]
    expected: "Hello World"
    check: exact

  - id: repeat_string
    category: String and Text Processing
    difficulty: Easy
    workflow: run
    description: "Return string s repeated n times."
    args: ["ab", 3]
    expected: "ababab"
    check: exact

  - id: find_all_indices
    category: String and Text Processing
    difficulty: Medium
    workflow: run
    description: "Return a list of all starting indices where substring sub appears in string s."
    args: ["abcabcabc", "abc"]
    expected: [0, 3, 6]
    check: exact

  # ──────────────────────────────────────────────
  # CATEGORY 2: Numerical and Mathematical (25)
  # ──────────────────────────────────────────────

  - id: is_prime
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return True if integer n is a prime number, False otherwise."
    args: [17]
    expected: true
    check: exact

  - id: fibonacci
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return the n-th Fibonacci number, 0-indexed, where F0=0 and F1=1."
    args: [10]
    expected: 55
    check: exact

  - id: factorial
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return the factorial of non-negative integer n."
    args: [6]
    expected: 720
    check: exact

  - id: gcd
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return the greatest common divisor of integers a and b."
    args: [48, 18]
    expected: 6
    check: exact

  - id: lcm
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return the least common multiple of integers a and b."
    args: [4, 6]
    expected: 12
    check: exact

  - id: is_perfect_number
    category: Numerical and Mathematical
    difficulty: Medium
    workflow: run
    description: "Return True if integer n equals the sum of its proper divisors (divisors excluding n itself)."
    args: [28]
    expected: true
    check: exact

  - id: sieve_of_eratosthenes
    category: Numerical and Mathematical
    difficulty: Medium
    workflow: run
    description: "Return a sorted list of all prime numbers less than or equal to integer n."
    args: [20]
    expected: [2, 3, 5, 7, 11, 13, 17, 19]
    check: exact

  - id: power_mod
    category: Numerical and Mathematical
    difficulty: Medium
    workflow: run
    description: "Return (base raised to the power exp) modulo mod, computed efficiently."
    args: [2, 10, 1000]
    expected: 24
    check: exact

  - id: count_prime_factors
    category: Numerical and Mathematical
    difficulty: Medium
    workflow: run
    description: "Return a dict mapping each prime factor of integer n to its multiplicity."
    args: [360]
    expected: {2: 3, 3: 2, 5: 1}
    check: exact

  - id: is_armstrong_number
    category: Numerical and Mathematical
    difficulty: Medium
    workflow: run
    description: "Return True if integer n is an Armstrong number where each digit is raised to the power of the number of digits."
    args: [153]
    expected: true
    check: exact

  - id: roman_to_int
    category: Numerical and Mathematical
    difficulty: Medium
    workflow: run
    description: "Convert Roman numeral string s to its integer value."
    args: ["MCMXCIV"]
    expected: 1994
    check: exact

  - id: int_to_roman
    category: Numerical and Mathematical
    difficulty: Medium
    workflow: run
    description: "Convert positive integer n to its Roman numeral representation as a string."
    args: [1994]
    expected: "MCMXCIV"
    check: exact

  - id: celsius_to_fahrenheit
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Convert temperature c from Celsius to Fahrenheit and return the result."
    args: [100]
    expected: 212.0
    check: exact

  - id: is_perfect_square
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return True if integer n is a perfect square."
    args: [144]
    expected: true
    check: exact

  - id: sum_of_digits
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return the sum of all digits of integer n."
    args: [12345]
    expected: 15
    check: exact

  - id: count_digits
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return the number of digits in integer n."
    args: [12345]
    expected: 5
    check: exact

  - id: is_even
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return True if integer n is even."
    args: [42]
    expected: true
    check: exact

  - id: clamp
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return value clamped to the range [lo, hi]. If value < lo return lo, if value > hi return hi, else return value."
    args: [15, 0, 10]
    expected: 10
    check: exact

  - id: nth_triangular
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return the n-th triangular number, defined as n*(n+1)/2."
    args: [10]
    expected: 55
    check: exact

  - id: binary_to_decimal
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Convert binary string b (containing only 0s and 1s) to its decimal integer value."
    args: ["1010"]
    expected: 10
    check: exact

  - id: decimal_to_binary
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Convert non-negative integer n to its binary representation as a string without the 0b prefix."
    args: [10]
    expected: "1010"
    check: exact

  - id: matrix_multiply
    category: Numerical and Mathematical
    difficulty: Hard
    workflow: run
    description: "Return the matrix product of two 2D integer lists A and B."
    args: [[[1, 2], [3, 4]], [[5, 6], [7, 8]]]
    expected: [[19, 22], [43, 50]]
    check: exact

  - id: average
    category: Numerical and Mathematical
    difficulty: Easy
    workflow: run
    description: "Return the arithmetic mean of a list of numbers nums as a float."
    args: [[1, 2, 3, 4, 5]]
    expected: 3.0
    check: exact

  - id: median
    category: Numerical and Mathematical
    difficulty: Medium
    workflow: run
    description: "Return the median of a list of numbers nums. For even length, return the average of the two middle values."
    args: [[3, 1, 4, 1, 5, 9]]
    expected: 3.5
    check: exact

  - id: standard_deviation
    category: Numerical and Mathematical
    difficulty: Hard
    workflow: run
    description: "Return the population standard deviation of a list of numbers nums, rounded to 4 decimal places."
    args: [[2, 4, 4, 4, 5, 5, 7, 9]]
    expected: 2.0
    check: exact

  # ──────────────────────────────────────────────
  # CATEGORY 3: Data Structures and Algorithms (25)
  # ──────────────────────────────────────────────

  - id: two_sum
    category: Data Structures and Algorithms
    difficulty: Easy
    workflow: run
    description: "Return a list of two indices from list nums whose values sum to target. Assume exactly one solution exists."
    args: [[2, 7, 11, 15], 9]
    expected: [0, 1]
    check: set_equal

  - id: max_subarray_sum
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return the maximum sum of any contiguous subarray of list nums using Kadane's algorithm."
    args: [[-2, 1, -3, 4, -1, 2, 1, -5, 4]]
    expected: 6
    check: exact

  - id: merge_sorted_lists
    category: Data Structures and Algorithms
    difficulty: Easy
    workflow: run
    description: "Return a single sorted list containing all elements from sorted lists l1 and l2."
    args: [[1, 3, 5], [2, 4, 6]]
    expected: [1, 2, 3, 4, 5, 6]
    check: exact

  - id: valid_parentheses
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return True if string s containing only brackets ()[]{}  has every opening bracket matched and properly closed."
    args: ["()[]{}" ]
    expected: true
    check: exact

  - id: rotate_array
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return list arr rotated to the right by k positions."
    args: [[1, 2, 3, 4, 5], 2]
    expected: [4, 5, 1, 2, 3]
    check: exact

  - id: find_kth_largest
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return the k-th largest element in list nums."
    args: [[3, 2, 1, 5, 6, 4], 2]
    expected: 5
    check: exact

  - id: group_anagrams
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return a list of groups where each group contains strings from list words that are anagrams of each other."
    args: [["eat", "tea", "tan", "ate", "nat", "bat"]]
    expected: [["eat", "tea", "ate"], ["tan", "nat"], ["bat"]]
    check: anagram_groups

  - id: coin_change
    category: Data Structures and Algorithms
    difficulty: Hard
    workflow: run
    description: "Return the minimum number of coins needed to make amount using denominations in list coins. Return -1 if impossible."
    args: [[1, 5, 10, 25], 36]
    expected: 3
    check: exact

  - id: longest_increasing_subsequence
    category: Data Structures and Algorithms
    difficulty: Hard
    workflow: run
    description: "Return the length of the longest strictly increasing subsequence in list nums."
    args: [[10, 9, 2, 5, 3, 7, 101, 18]]
    expected: 4
    check: exact

  - id: binary_search
    category: Data Structures and Algorithms
    difficulty: Easy
    workflow: run
    description: "Return the index of target in sorted list arr, or -1 if not present."
    args: [[1, 3, 5, 7, 9, 11], 7]
    expected: 3
    check: exact

  - id: flatten
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return a flat list containing all elements from nested list lst of arbitrary depth."
    args: [[[1, [2, 3]], [4, [5, [6]]]]  ]
    expected: [1, 2, 3, 4, 5, 6]
    check: exact

  - id: remove_duplicates_list
    category: Data Structures and Algorithms
    difficulty: Easy
    workflow: run
    description: "Return list nums with duplicates removed, preserving original order."
    args: [[1, 2, 2, 3, 4, 3, 5]]
    expected: [1, 2, 3, 4, 5]
    check: exact

  - id: intersection
    category: Data Structures and Algorithms
    difficulty: Easy
    workflow: run
    description: "Return a sorted list of elements that appear in both list a and list b, without duplicates."
    args: [[1, 2, 3, 4], [3, 4, 5, 6]]
    expected: [3, 4]
    check: exact

  - id: union_lists
    category: Data Structures and Algorithms
    difficulty: Easy
    workflow: run
    description: "Return a sorted list of all unique elements that appear in either list a or list b."
    args: [[1, 2, 3], [3, 4, 5]]
    expected: [1, 2, 3, 4, 5]
    check: exact

  - id: bubble_sort
    category: Data Structures and Algorithms
    difficulty: Easy
    workflow: run
    description: "Return a new sorted list with elements of list nums sorted in ascending order using bubble sort."
    args: [[64, 34, 25, 12, 22, 11, 90]]
    expected: [11, 12, 22, 25, 34, 64, 90]
    check: exact

  - id: count_occurrences
    category: Data Structures and Algorithms
    difficulty: Easy
    workflow: run
    description: "Return the number of times element target appears in list lst."
    args: [[1, 2, 3, 2, 1, 2], 2]
    expected: 3
    check: exact

  - id: chunk_list
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return list lst split into consecutive chunks of size n. The last chunk may be smaller."
    args: [[1, 2, 3, 4, 5, 6, 7], 3]
    expected: [[1, 2, 3], [4, 5, 6], [7]]
    check: exact

  - id: zip_lists
    category: Data Structures and Algorithms
    difficulty: Easy
    workflow: run
    description: "Return a list of pairs combining corresponding elements from lists a and b. Stop at the shorter list."
    args: [[1, 2, 3], ["a", "b", "c"]]
    expected: [[1, "a"], [2, "b"], [3, "c"]]
    check: exact

  - id: find_missing_number
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return the single missing integer from list nums which contains n-1 distinct integers in range 1 to n."
    args: [[1, 2, 4, 5, 6]]
    expected: 3
    check: exact

  - id: max_profit
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return the maximum profit from one buy-then-sell transaction given list prices of stock prices. Return 0 if no profit is possible."
    args: [[7, 1, 5, 3, 6, 4]]
    expected: 5
    check: exact

  - id: product_except_self
    category: Data Structures and Algorithms
    difficulty: Hard
    workflow: run
    description: "Return a list where each element is the product of all elements in list nums except the element at that index. Do not use division."
    args: [[1, 2, 3, 4]]
    expected: [24, 12, 8, 6]
    check: exact

  - id: sliding_window_max
    category: Data Structures and Algorithms
    difficulty: Hard
    workflow: run
    description: "Return a list of the maximum values in each sliding window of size k over list nums."
    args: [[1, 3, -1, -3, 5, 3, 6, 7], 3]
    expected: [3, 3, 5, 5, 6, 7]
    check: exact

  - id: three_sum
    category: Data Structures and Algorithms
    difficulty: Hard
    workflow: run
    description: "Return all unique triplets from list nums that sum to zero. Each triplet should be sorted internally."
    args: [[-1, 0, 1, 2, -1, -4]]
    expected: [[-1, -1, 2], [-1, 0, 1]]
    check: triplet_equal

  - id: is_balanced_tree
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Given a list representing a binary tree in level-order where None indicates missing nodes, return True if the tree is height-balanced."
    args: [[1, 2, 3, 4, 5]]
    expected: true
    check: exact

  - id: frequency_sort
    category: Data Structures and Algorithms
    difficulty: Medium
    workflow: run
    description: "Return list nums sorted by element frequency in ascending order. For equal frequency, sort by element value."
    args: [[1, 1, 2, 3, 3, 3, 2]]
    expected: [2, 2, 1, 1, 3, 3, 3]
    check: exact

  # ──────────────────────────────────────────────
  # CATEGORY 4: File and IO Utilities (15)
  # ──────────────────────────────────────────────

  - id: count_lines
    category: File and IO Utilities
    difficulty: Easy
    workflow: run
    description: "Return the number of non-empty lines in the text string content."
    args: ["line one\nline two\n\nline three\n"]
    expected: 3
    check: exact

  - id: parse_json_field
    category: File and IO Utilities
    difficulty: Medium
    workflow: run
    description: "Return the value at dot-notation key_path from JSON string json_str. Return None if path does not exist."
    args: ["{\"user\": {\"name\": \"Alice\", \"age\": 30}}", "user.name"]
    expected: "Alice"
    check: exact

  - id: flatten_dict
    category: File and IO Utilities
    difficulty: Medium
    workflow: run
    description: "Return a flattened version of nested dict d where keys are joined with dots."
    args: [{"a": {"b": {"c": 1}}, "d": 2}]
    expected: {"a.b.c": 1, "d": 2}
    check: exact

  - id: merge_dicts
    category: File and IO Utilities
    difficulty: Easy
    workflow: run
    description: "Return a new dict containing all key-value pairs from dicts a and b. For duplicate keys, values from b take priority."
    args: [{"x": 1, "y": 2}, {"y": 99, "z": 3}]
    expected: {"x": 1, "y": 99, "z": 3}
    check: exact

  - id: invert_dict
    category: File and IO Utilities
    difficulty: Easy
    workflow: run
    description: "Return a new dict with keys and values swapped from dict d. Assume all values are unique and hashable."
    args: [{"a": 1, "b": 2, "c": 3}]
    expected: {1: "a", 2: "b", 3: "c"}
    check: exact

  - id: deep_merge_dicts
    category: File and IO Utilities
    difficulty: Medium
    workflow: run
    description: "Return a deep merge of dicts a and b. Nested dicts are merged recursively; scalars from b override a."
    args: [{"x": {"a": 1, "b": 2}}, {"x": {"b": 99, "c": 3}, "y": 4}]
    expected: {"x": {"a": 1, "b": 99, "c": 3}, "y": 4}
    check: exact

  - id: filter_dict_by_keys
    category: File and IO Utilities
    difficulty: Easy
    workflow: run
    description: "Return a new dict containing only the key-value pairs from dict d whose keys appear in list keys."
    args: [{"a": 1, "b": 2, "c": 3, "d": 4}, ["a", "c"]]
    expected: {"a": 1, "c": 3}
    check: exact

  - id: group_by
    category: File and IO Utilities
    difficulty: Medium
    workflow: run
    description: "Group list of dicts records by the value of key field. Return a dict mapping each unique field value to a list of matching records."
    args: [[{"type": "fruit", "name": "apple"}, {"type": "veg", "name": "carrot"}, {"type": "fruit", "name": "banana"}], "type"]
    expected: {"fruit": [{"type": "fruit", "name": "apple"}, {"type": "fruit", "name": "banana"}], "veg": [{"type": "veg", "name": "carrot"}]}
    check: exact

  - id: csv_to_list
    category: File and IO Utilities
    difficulty: Easy
    workflow: run
    description: "Parse CSV string csv_str and return a list of lists where the first row is treated as a header."
    args: ["name,age\nAlice,30\nBob,25"]
    expected: [["name", "age"], ["Alice", "30"], ["Bob", "25"]]
    check: exact

  - id: list_to_csv
    category: File and IO Utilities
    difficulty: Easy
    workflow: run
    description: "Convert a list of lists rows to a CSV formatted string with rows separated by newlines and values by commas."
    args: [[["name", "age"], ["Alice", "30"], ["Bob", "25"]]]
    expected: "name,age\nAlice,30\nBob,25"
    check: exact

  - id: transpose_matrix
    category: File and IO Utilities
    difficulty: Medium
    workflow: run
